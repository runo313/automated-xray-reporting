name: xray-report
channels:
  - pytorch
  - conda-forge
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - torchvision
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas
  - pillow
  - scikit-learn
  - pyyaml
  - tqdm
  - matplotlib
  - jupyter
  - pyarrow
  - fastparquet
  - pip
  - pip:
      - boto3
      - fastapi
      - uvicorn
      - -e 
      - redivis
