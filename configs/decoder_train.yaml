# Config for Layer 3: findings-conditioned report decoder

data:
  dataset: iu_xray
  data_dir: null
  reports_source: null         # path to IU X-Ray report text once downloaded
  batch_size: null
  vocab:
    min_freq: 2
    special_tokens: ["<pad>", "<bos>", "<eos>", "<unk>"]

model:
  encoder_checkpoint: checkpoints/encoder_supervised_v1.pt   # swap to self-supervised variant for comparison
  findings_classifier_checkpoint: checkpoints/findings_classifier_v1.pt
  decoder_type: gru            # gru first; transformer decoder is a stretch-goal swap
  hidden_size: null
  embed_size: null
  attention: bahdanau

optimizer:
  name: adam
  lr: null

training:
  epochs: null
  teacher_forcing: true
  loss: masked_cross_entropy
  seed: 42

decoding:
  strategy: greedy             # revisit beam search once baseline works

evaluation:
  metrics: [bleu4, findings_overlap]

checkpoint:
  save_local: checkpoints/decoder_v1.pt
  push_to_s3: null
