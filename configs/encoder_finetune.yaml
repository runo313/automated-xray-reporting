# Config for Layer 1: image encoder
# Two modes will use this same config shape later:
#   - stage: "supervised_finetune"   (fine-tune pretrained CNN on labeled findings data)
#   - stage: "self_supervised"       (pretrain on unlabeled images before fine-tuning)

stage: supervised_finetune   # placeholder - not yet run

data:
  dataset: chexpert          # placeholder, update once dataset is acquired
  data_dir: null              # local instance path, filled in on EC2
  image_size: 224
  batch_size: null

model:
  backbone: resnet50          # starting point; revisit after baseline works
  pretrained: imagenet

optimizer:
  name: adam                  # NOTE: verify this matches what's actually used at train time
  lr: null
  weight_decay: null

training:
  epochs: null
  seed: 42

checkpoint:
  save_local: checkpoints/encoder_supervised_v1.pt
  push_to_s3: null            # s3://<bucket>/checkpoints/... filled in later
