# Config for Layer 2: multi-label findings classifier

data:
  dataset: chexpert
  data_dir: null
  labels_csv: null            # path to CheXpert label file once downloaded
  uncertain_label_policy: null  # decide: treat "uncertain" as positive / negative / separate class
  batch_size: null

model:
  encoder_checkpoint: checkpoints/encoder_supervised_v1.pt
  freeze_encoder: false
  findings:                   # fixed vocabulary - confirm against actual CheXpert columns
    - cardiomegaly
    - edema
    - consolidation
    - atelectasis
    - pleural_effusion
    - pneumothorax
    - no_finding

optimizer:
  name: adam
  lr: null

training:
  epochs: null
  loss: bce_with_logits        # per-finding binary cross-entropy
  seed: 42

evaluation:
  metrics: [auc, f1]

checkpoint:
  save_local: checkpoints/findings_classifier_v1.pt
  push_to_s3: null
