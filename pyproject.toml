[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xray_report"
version = "0.1.0"
description = "Findings-conditioned chest X-ray report generation"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "pyyaml",
    "tqdm",
    "boto3",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
dev = ["pytest", "jupyter", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]
